<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Upkeep Utah</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page" id="page"></div>

<script>
(function() {
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwEkYZ8hni7Z6XIFI9t44dgc8XhphC52BvRV8IGiZjoXwU-C5bjuikxgYZPueTu-cvs/exec';

  var page = document.getElementById('page');

  /* ── Decode data parameter ── */
  function getWorkOrder() {
    try {
      var params = new URLSearchParams(window.location.search);
      var raw = params.get('data');
      if (!raw) return null;
      var b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4 !== 0) b64 += '=';
      var json = atob(b64);
      return JSON.parse(json);
    } catch (e) {
      return null;
    }
  }

  var wo = getWorkOrder();

  if (!wo) {
    page.innerHTML =
      '<div class="error-page">' +
        '<h2>Unable to load document.</h2>' +
        '<p>Please contact Upkeep Utah.</p>' +
      '</div>';
    return;
  }

  /* ── Helpers ── */
  function esc(s) {
    if (typeof s !== 'string') return '';
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }

  function currency(n) {
    var v = parseFloat(n) || 0;
    return '$' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function statusLabel(s) {
    if (!s) return 'ESTIMATE';
    return s.replace(/_/g, ' ');
  }

  function todayString() {
    var d = new Date();
    var opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
    return d.toLocaleDateString('en-US', opts);
  }

  /* ── Set dynamic page title ── */
  document.title = 'Upkeep Utah \u2014 ' + statusLabel(wo.status);

  /* ── Calculate total ── */
  var items = wo.lineItems || [];
  var subtotal = 0;
  for (var i = 0; i < items.length; i++) {
    subtotal += parseFloat(items[i].price) || 0;
  }

  var discount = parseFloat(wo.discount) || 0;
  var total = subtotal - discount;
  if (total < 0) total = 0;

  /* ── Determine document status (gates estimate-only features) ── */
  var st = (wo.status || '').toUpperCase();
  var isEstimate = (st === 'ESTIMATE' || st === '');

  /* ── Build HTML ── */
  var html = '';

  /* Header — full bleed, no border */
  html += '<div class="header">';
  html += '<img src="https://dallas-debug.github.io/upkeep-utah-docs/UPKEEPLOGO3.webp" class="header-logo" alt="Upkeep Utah Logo">';
  html += '<div class="header-info">';
  html += '<h1>Upkeep Utah Inc.</h1>';
  html += '<p>PO Box 1118, Ogden, UT 84402</p>';
  html += '<p>Utah B100 General Contractor #12092373-5501</p>';
  html += '</div>';
  html += '</div>';

  /* Doc type */
  html += '<div class="doc-type">';
  html += '<h2>' + esc(statusLabel(wo.status)) + '</h2>';
  html += '<div class="updated">Updated ' + todayString() + '</div>';
  html += '</div>';

  /* Customer info */
  html += '<div class="section">';
  html += '<div class="section-label">Customer</div>';
  if (wo.customerName)    html += '<p><strong>' + esc(wo.customerName) + '</strong></p>';
  if (wo.customerAddress) html += '<p>' + esc(wo.customerAddress) + '</p>';
  if (wo.customerPhone)   html += '<p>' + esc(wo.customerPhone) + '</p>';
  if (wo.customerEmail)   html += '<p>' + esc(wo.customerEmail) + '</p>';
  html += '</div>';

  /* Schedule */
  if (wo.scheduledDate) {
    html += '<div class="section">';
    html += '<div class="section-label">Schedule</div>';
    html += '<p>' + esc(wo.scheduledDate) + '</p>';
    html += '</div>';
  }

  /* Line items */
  if (items.length > 0) {
    html += '<div class="section">';
    html += '<div class="section-label">Scope of Work</div>';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      html += '<div class="line-item">';
      html += '<div class="li-header">';
      html += '<span class="li-title">' + esc(it.title) + '</span>';
      html += '<span class="li-price">' + currency(it.price) + '</span>';
      html += '</div>';
      var subs = it.subTasks || [];
      if (subs.length > 0) {
        html += '<ul class="sub-tasks">';
        for (var j = 0; j < subs.length; j++) {
          html += '<li>' + esc(subs[j]) + '</li>';
        }
        html += '</ul>';
      }
      html += '</div>';
    }

    /* Adjustment / discount line — contractor names this row */
    if (discount > 0) {
      var discLabel = wo.discountLabel || 'Adjustment';
      html += '<div class="line-item adjustment">';
      html += '<div class="li-header">';
      html += '<span class="li-title">' + esc(discLabel) + '</span>';
      html += '<span class="li-price">\u2212' + currency(discount) + '</span>';
      html += '</div>';
      if (wo.discountDescription && wo.discountDescription.trim()) {
        html += '<div class="li-desc">' + esc(wo.discountDescription) + '</div>';
      }
      html += '</div>';
    }

    html += '</div>';
  }

  /* Notes */
  if (wo.notes && wo.notes.trim()) {
    html += '<div class="section">';
    html += '<div class="section-label">Contractor Notes</div>';
    html += '<p class="notes-text">' + esc(wo.notes) + '</p>';
    html += '</div>';
  }

  /* Context anchors — ESTIMATE only */
  var anchors = wo.contextAnchors || [];
  var anchorFreeText = (wo.contextFreeText || '').trim();
  if (isEstimate && (anchors.length > 0 || anchorFreeText)) {
    html += '<div class="context-anchors">';
    html += '<ul class="anchor-list">';
    for (var i = 0; i < anchors.length; i++) {
      html += '<li class="anchor-item">';
      html += '<span class="anchor-check" aria-hidden="true">&#10003;</span>';
      html += '<span>' + esc(anchors[i]) + '</span>';
      html += '</li>';
    }
    if (anchorFreeText) {
      html += '<li class="anchor-item">';
      html += '<span class="anchor-check" aria-hidden="true">&#10003;</span>';
      html += '<span>' + esc(anchorFreeText) + '</span>';
      html += '</li>';
    }
    html += '</ul>';
    html += '</div>';
  }

  /* Psych price anchor — directly above total bar, ESTIMATE only */
  if (isEstimate && wo.avgCost) {
    var avgLabel = wo.avgCostLabel || 'Average Cost';
    var avgAmount = currency(wo.avgCost);
    html += '<div class="psych-price-bar">';
    html += '<span class="psych-label">' + esc(avgLabel) + ':</span> ';
    html += '<span class="psych-amount">' + avgAmount + '</span>';
    if (wo.avgCostSource) {
      html += '<button class="psych-source-btn" type="button" ';
      html += 'data-source="' + esc(wo.avgCostSource) + '" ';
      html += 'aria-label="View source">';
      html += '<sup>1</sup>';
      html += '</button>';
    }
    html += '</div>';
  }

  /* Total bar */
  html += '<div class="total-bar">';
  html += '<span>TOTAL</span>';
  html += '<span>' + currency(total) + '</span>';
  html += '</div>';

  /* Guarantee */
  html += '<div class="guarantee">Never surprise charges, guaranteed.</div>';

  /* Pay Now (INVOICE only) */
  if (st === 'INVOICE') {
    html += '<div class="pay-now-wrap">';
    html += '<a class="pay-now-btn" href="https://pay.upkeeputah.com/placeholder">Pay Now</a>';
    html += '</div>';
  }

  /* Signature section — ESTIMATE only */
  if (isEstimate) {

    /* Show previously captured signature if present */
    if (wo.signatureBase64) {
      html += '<div class="section">';
      html += '<div class="section-label">Customer Approval</div>';
      html += '<img src="' + esc(wo.signatureBase64) + '" class="sig-preview" alt="Customer signature">';
      html += '</div>';
    }

    /* Approval section — full-width, no card */
    html += '<div class="section approval-section" id="approval-card">';
    html += '<div class="section-label">Customer Approval</div>';

    /* Budget alignment — above signature fields, inside approval section */
    if (wo.budgetAlignment) {
      html += '<div class="budget-wrap" id="budget-wrap">';
      html += '<button class="budget-btn" id="budget-btn" type="button">Request Budget Alignment</button>';
      html += '<div class="budget-pending" id="budget-pending" style="display:none;">';
      html += '<span class="budget-pending-amount" id="budget-pending-amount"></span>';
      html += '<span class="budget-pending-label">\u2014 pending approval</span>';
      html += '</div>';
      html += '</div>';

      /* Budget alignment modal */
      html += '<div class="budget-modal-overlay" id="budget-modal-overlay">';
      html += '<div class="budget-modal">';
      html += '<div class="budget-modal-header">';
      html += '<h4>Budget Alignment</h4>';
      html += '<button class="budget-modal-close" id="budget-modal-close" type="button" aria-label="Close">&times;</button>';
      html += '</div>';
      html += '<p class="budget-modal-desc">Enter your desired budget and let us know what changes you\'d like to make it work.</p>';
      html += '<label class="budget-modal-label" for="budget-amount">Your Budget</label>';
      html += '<div class="budget-input-wrap">';
      html += '<span class="budget-input-prefix">$</span>';
      html += '<input type="number" id="budget-amount" class="budget-input" placeholder="0.00" min="0" step="0.01" inputmode="decimal">';
      html += '</div>';
      html += '<label class="budget-modal-label" for="budget-notes">Changes or Notes <span class="budget-optional">(optional)</span></label>';
      html += '<textarea id="budget-notes" class="budget-textarea" rows="3" placeholder="What changes would help reach this budget?"></textarea>';
      html += '<button class="budget-modal-submit" id="budget-modal-submit" type="button">Submit</button>';
      html += '</div>';
      html += '</div>';
    }

    html += '<label class="approval-label" for="signer-name">Full name</label>';
    html += '<span class="approval-helper">Authorized signer</span>';
    html += '<input type="text" id="signer-name" class="approval-input" placeholder="Enter your full name" autocomplete="name">';

    html += '<label class="approval-label">Date</label>';
    html += '<div class="approval-date" id="sig-date">' + todayString() + '</div>';

    html += '<label class="approval-label">Signature</label>';
    html += '<div class="canvas-wrap" id="canvas-wrap">';
    html += '<canvas id="sig-canvas"></canvas>';
    html += '<div class="canvas-sig-line"></div>';
    html += '<span class="canvas-hint" id="canvas-hint">Sign here</span>';
    html += '</div>';

    html += '<div class="btn-row">';
    html += '<button class="btn-clear" id="btn-clear" type="button">Clear Signature</button>';
    html += '<button class="btn-submit" id="btn-submit" type="button">Submit Signature</button>';
    html += '</div>';
    html += '</div>';
  }

  /* Footer */
  html += '<div class="footer">';
  html += '<img src="https://dallas-debug.github.io/upkeep-utah-docs/Warranty.webp" class="warranty-badge" alt="Lifetime Warranty">';
  html += '<div class="tagline">Built right. Guaranteed for life.</div>';
  html += '<div class="contact-line">Upkeep Utah | P.O. Box 1118 Ogden, UT 84402 | (801) 814-9627</div>';
  html += '<div class="legal-line">Property of Upkeep Utah | All Rights Reserved</div>';
  html += '<div class="company-line">Upkeep Utah Inc. | upkeeputah.com | upkeeputah@gmail.com</div>';
  html += '</div>';

  page.innerHTML = html;

  /* ── Signature canvas logic (ESTIMATE only) ── */
  if (isEstimate) {
  var canvas = document.getElementById('sig-canvas');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('canvas-wrap');
  var hint = document.getElementById('canvas-hint');
  var submitBtn = document.getElementById('btn-submit');
  var clearBtn = document.getElementById('btn-clear');
  var signerInput = document.getElementById('signer-name');
  var approvalCard = document.getElementById('approval-card');
  var drawing = false;
  var hasDrawn = false;

  function resizeCanvas() {
    var rect = wrap.getBoundingClientRect();
    var w = rect.width;
    /* Responsive height: ~40% of width on phones, capped for desktop */
    var h = Math.min(Math.round(w * 0.4), 220);
    canvas.width = w;
    canvas.height = h;
    ctx.strokeStyle = '#1A3646';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }
  resizeCanvas();
  window.addEventListener('resize', function() {
    if (!hasDrawn) resizeCanvas();
  });

  function getPos(e) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    if (e.touches && e.touches.length > 0) {
      return {
        x: (e.touches[0].clientX - rect.left) * scaleX,
        y: (e.touches[0].clientY - rect.top) * scaleY
      };
    }
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    hasDrawn = true;
    hint.style.display = 'none';
    var p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }

  function moveDraw(e) {
    if (!drawing) return;
    e.preventDefault();
    var p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }

  function endDraw(e) {
    if (!drawing) return;
    e.preventDefault();
    drawing = false;
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);

  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', moveDraw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
  canvas.addEventListener('touchcancel', endDraw);

  clearBtn.addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasDrawn = false;
    hint.style.display = '';
  });

  function freezeForm() {
    approvalCard.classList.add('frozen');
    signerInput.readOnly = true;
    canvas.removeEventListener('mousedown', startDraw);
    canvas.removeEventListener('mousemove', moveDraw);
    canvas.removeEventListener('mouseup', endDraw);
    canvas.removeEventListener('mouseleave', endDraw);
    canvas.removeEventListener('touchstart', startDraw);
    canvas.removeEventListener('touchmove', moveDraw);
    canvas.removeEventListener('touchend', endDraw);
    canvas.removeEventListener('touchcancel', endDraw);
    submitBtn.disabled = true;
  }

  submitBtn.addEventListener('click', async function() {
    var name = signerInput.value.trim();
    if (!name) {
      alert('Please enter the authorized signer name.');
      return;
    }
    if (!hasDrawn) {
      alert('Please provide a signature before submitting.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = 'SENDING...';

    var customerName = wo.customerName || 'Unknown';
    var docId = wo.id || 'N/A';
    var timestamp = new Date().toLocaleString();

    /* Gather budget alignment data if submitted */
    var budgetAmountEl = document.getElementById('budget-amount');
    var budgetNotesEl = document.getElementById('budget-notes');
    var budgetAmount = budgetAmountEl ? budgetAmountEl.value : '';
    var budgetNotes = budgetNotesEl ? budgetNotesEl.value : '';

    var data = {
      name: name,
      date: new Date().toISOString().split('T')[0],
      signature: canvas.toDataURL('image/png'),
      customerName: customerName,
      documentId: docId,
      documentStatus: wo.status || 'ESTIMATE',
      timestamp: timestamp,
      budgetAlignmentAmount: budgetAmount,
      budgetAlignmentNotes: budgetNotes
    };

    try {
      var params = new URLSearchParams();
      for (var key in data) {
        params.append(key, data[key]);
      }

      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: params
      });

      freezeForm();

      /* Also freeze budget alignment button if it exists */
      var budgetBtn = document.getElementById('budget-btn');
      if (budgetBtn) {
        budgetBtn.disabled = true;
        budgetBtn.classList.add('submitted');
      }

      approvalCard.innerHTML = '<div class="thank-you">&#10003; Thank you! Your signature has been submitted successfully.</div>';

    } catch (error) {
      console.error('Submission error:', error);
      alert('Submission error. Please try again.');
      submitBtn.disabled = false;
      submitBtn.innerText = 'Submit Signature';
    }
  });
  }

  /* ── Budget alignment modal logic (ESTIMATE only) ── */
  var budgetBtn = document.getElementById('budget-btn');
  if (budgetBtn) {
    var overlay = document.getElementById('budget-modal-overlay');
    var closeBtn = document.getElementById('budget-modal-close');
    var modalSubmit = document.getElementById('budget-modal-submit');
    var amountInput = document.getElementById('budget-amount');
    var notesInput = document.getElementById('budget-notes');
    var pendingEl = document.getElementById('budget-pending');
    var pendingAmountEl = document.getElementById('budget-pending-amount');
    var budgetSubmitted = false;

    function openBudgetModal() {
      overlay.classList.add('open');
      /* Focus the amount field after animation */
      setTimeout(function() { amountInput.focus(); }, 200);
    }

    function closeBudgetModal() {
      overlay.classList.remove('open');
    }

    /* Toggle: open modal on button click */
    budgetBtn.addEventListener('click', function() {
      openBudgetModal();
    });

    /* Close button */
    closeBtn.addEventListener('click', closeBudgetModal);

    /* Click overlay background to close */
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeBudgetModal();
    });

    /* Escape key to close */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && overlay.classList.contains('open')) {
        closeBudgetModal();
      }
    });

    /* Submit budget alignment */
    modalSubmit.addEventListener('click', function() {
      var amount = parseFloat(amountInput.value);
      if (!amount || amount <= 0) {
        alert('Please enter your desired budget amount.');
        return;
      }

      /* Close modal */
      closeBudgetModal();

      /* Update button to submitted state */
      budgetSubmitted = true;
      budgetBtn.classList.add('submitted');
      budgetBtn.textContent = 'Budget Alignment Requested \u2713';

      /* Show pending amount */
      pendingAmountEl.textContent = '$' + amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      pendingEl.style.display = '';
    });
  }

  /* ── Psych price source tooltip (ESTIMATE only) ── */
  var psychSourceBtn = document.querySelector('.psych-source-btn');
  if (psychSourceBtn) {
    var tooltipTimeout = null;
    psychSourceBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var sourceUrl = this.getAttribute('data-source');
      if (!sourceUrl) return;

      /* Remove any existing tooltip */
      var existing = document.querySelector('.psych-tooltip');
      if (existing) existing.remove();
      if (tooltipTimeout) clearTimeout(tooltipTimeout);

      /* Create and position tooltip */
      var tooltip = document.createElement('div');
      tooltip.className = 'psych-tooltip';
      tooltip.textContent = sourceUrl;
      this.parentNode.appendChild(tooltip);

      /* Auto-dismiss after 4 seconds */
      tooltipTimeout = setTimeout(function() {
        tooltip.classList.add('fade-out');
        setTimeout(function() { tooltip.remove(); }, 250);
      }, 4000);
    });

    /* Tap anywhere else to dismiss early */
    document.addEventListener('click', function() {
      var tooltip = document.querySelector('.psych-tooltip');
      if (tooltip) {
        tooltip.classList.add('fade-out');
        setTimeout(function() { tooltip.remove(); }, 250);
        if (tooltipTimeout) clearTimeout(tooltipTimeout);
      }
    });
  }

})();
</script>
</body>
</html>
